name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: build
        run: go build ./cmd/port-keeper
      - name: cross-build (windows, linux)
        run: |
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=linux GOARCH=arm64 go build ./...
      - name: install script tests
        run: sh scripts/install_test.sh
      - name: README mirrors in sync
        run: sh scripts/readme_sync_check.sh
      - name: agent eval setup (no API)
        run: PK_EVAL_BIN=./port-keeper sh scripts/agent_eval.sh --dry-run

  # The release path only runs on a tag, so its inputs are checked here.
  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: shellcheck scripts/*.sh
      - name: agent eval scenarios list
        run: sh scripts/agent_eval.sh --list
      - name: goreleaser check
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.2 # keep in step with release.yml
          args: check
