name: Supply chain

# Dependency audit, kept apart from ci.yml: advisories keep appearing without
# any change to the tree, so this also runs on a weekly cron and can be
# triggered by hand. The cron lines up with Dependabot's Monday morning run.
on:
  push:
    branches: ["**"]
    paths:
      - "go.mod"
      - "go.sum"
      - ".github/workflows/audit.yml"
  pull_request:
    paths:
      - "go.mod"
      - "go.sum"
      - ".github/workflows/audit.yml"
  schedule:
    - cron: "20 0 * * 1" # Monday 00:20 UTC = 09:20 JST
  workflow_dispatch:

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: govulncheck (reachable code paths only)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
